<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%" opacity="0.85">
  <defs>
    <linearGradient id="fadeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <style>
      .map-path { fill: none; stroke: #cbd5e1; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
      .map-land { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; opacity: 0.65; }
      .icon-stroke { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
      .icon-fill { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.8; opacity: 0.6; }
      .line-arc { fill: none; stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 4; opacity: 0.7; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#fadeBg)"/>

  <!-- Simplified Elegant World Map Vector Outline -->
  <g class="map-land">
    <!-- North America -->
    <path d="M 150 180 C 200 120, 320 140, 420 180 C 480 210, 450 280, 380 320 C 320 350, 240 380, 200 300 Z"/>
    <!-- South America -->
    <path d="M 400 420 C 440 420, 520 480, 490 600 C 460 700, 410 780, 380 750 C 350 700, 370 520, 400 420 Z"/>
    <!-- Europe -->
    <path d="M 750 150 C 820 130, 890 170, 880 230 C 840 270, 780 260, 750 220 Z"/>
    <!-- Africa -->
    <path d="M 720 300 C 840 290, 920 380, 890 520 C 860 620, 800 680, 750 620 C 710 550, 700 400, 720 300 Z"/>
    <!-- Asia -->
    <path d="M 920 150 C 1100 120, 1350 200, 1300 380 C 1200 450, 1050 420, 950 320 Z"/>
    <!-- Australia -->
    <path d="M 1250 550 C 1350 530, 1420 620, 1380 700 C 1300 750, 1220 680, 1250 550 Z"/>
  </g>

  <!-- Network Connection Arcs -->
  <path d="M 320 250 Q 550 150 800 200" class="line-arc"/>
  <path d="M 800 200 Q 1050 150 1150 280" class="line-arc"/>
  <path d="M 450 550 Q 600 450 780 480" class="line-arc"/>
  <path d="M 780 480 Q 1020 520 1300 620" class="line-arc"/>
  <path d="M 320 250 Q 380 400 450 550" class="line-arc"/>
  <path d="M 1150 280 Q 1250 420 1300 620" class="line-arc"/>

  <!-- 1. Top-Left Crane & Container Icon -->
  <g transform="translate(420, 210) scale(1.1)">
    <!-- Crane Hook Line -->
    <line x1="50" y1="0" x2="50" y2="35" class="icon-stroke"/>
    <path d="M 45 35 Q 50 45 55 35" class="icon-stroke"/>
    <!-- Shipping Container -->
    <rect x="15" y="45" width="70" height="45" rx="4" class="icon-fill"/>
    <line x1="28" y1="45" x2="28" y2="90" class="icon-stroke"/>
    <line x1="41" y1="45" x2="41" y2="90" class="icon-stroke"/>
    <line x1="54" y1="45" x2="54" y2="90" class="icon-stroke"/>
    <line x1="67" y1="45" x2="67" y2="90" class="icon-stroke"/>
  </g>

  <!-- 2. Top-Right Paper Airplane Icon -->
  <g transform="translate(1120, 220) scale(1.1)">
    <path d="M 10 50 L 80 10 L 50 80 L 40 55 Z" class="icon-fill"/>
    <line x1="80" y1="10" x2="40" y2="55" class="icon-stroke"/>
  </g>

  <!-- 3. Bottom-Center Crane & Container Icon -->
  <g transform="translate(820, 520) scale(1.25)">
    <line x1="50" y1="0" x2="50" y2="35" class="icon-stroke"/>
    <path d="M 45 35 Q 50 45 55 35" class="icon-stroke"/>
    <rect x="12" y="45" width="76" height="48" rx="4" class="icon-fill"/>
    <line x1="27" y1="45" x2="27" y2="93" class="icon-stroke"/>
    <line x1="42" y1="45" x2="42" y2="93" class="icon-stroke"/>
    <line x1="57" y1="45" x2="57" y2="93" class="icon-stroke"/>
    <line x1="72" y1="45" x2="72" y2="93" class="icon-stroke"/>
  </g>

  <!-- 4. Left-Bottom Anchor Icon -->
  <g transform="translate(560, 640) scale(1.1)">
    <circle cx="40" cy="15" r="8" class="icon-stroke"/>
    <line x1="40" y1="23" x2="40" y2="75" class="icon-stroke"/>
    <line x1="25" y1="35" x2="55" y2="35" class="icon-stroke"/>
    <path d="M 15 50 C 15 75, 65 75, 65 50" class="icon-stroke"/>
    <path d="M 10 45 L 15 50 L 20 45" class="icon-stroke"/>
    <path d="M 60 45 L 65 50 L 70 45" class="icon-stroke"/>
  </g>

  <!-- 5. Center-Right Document Sheet Icon -->
  <g transform="translate(1080, 440) scale(1.1)">
    <path d="M 15 10 L 55 10 L 75 30 L 75 90 L 15 90 Z" class="icon-fill"/>
    <path d="M 55 10 L 55 30 L 75 30" class="icon-stroke"/>
    <line x1="28" y1="42" x2="62" y2="42" class="icon-stroke"/>
    <line x1="28" y1="56" x2="62" y2="56" class="icon-stroke"/>
    <line x1="28" y1="70" x2="50" y2="70" class="icon-stroke"/>
  </g>

  <!-- 6. Bottom-Right AI Chip Node Icon -->
  <g transform="translate(1250, 710) scale(1.1)">
    <rect x="25" y="25" width="50" height="50" rx="8" class="icon-fill"/>
    <!-- Chip pins -->
    <line x1="35" y1="12" x2="35" y2="25" class="icon-stroke"/>
    <line x1="50" y1="12" x2="50" y2="25" class="icon-stroke"/>
    <line x1="65" y1="12" x2="65" y2="25" class="icon-stroke"/>
    <line x1="35" y1="75" x2="35" y2="88" class="icon-stroke"/>
    <line x1="50" y1="75" x2="50" y2="88" class="icon-stroke"/>
    <line x1="65" y1="75" x2="65" y2="88" class="icon-stroke"/>
    <line x1="12" y1="35" x2="25" y2="35" class="icon-stroke"/>
    <line x1="12" y1="50" x2="25" y2="50" class="icon-stroke"/>
    <line x1="12" y1="65" x2="25" y2="65" class="icon-stroke"/>
    <line x1="75" y1="35" x2="88" y2="35" class="icon-stroke"/>
    <line x1="75" y1="50" x2="88" y2="50" class="icon-stroke"/>
    <line x1="75" y1="65" x2="88" y2="65" class="icon-stroke"/>
    <text x="50" y="56" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#64748b" text-anchor="middle">AI</text>
  </g>
</svg>
